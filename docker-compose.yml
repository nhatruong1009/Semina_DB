version: "3.9"

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "20261:27017"
    volumes:
      - mongodb_data:/data/db

  neo4j:
    image: neo4j:5.20
    container_name: neo4j
    restart: always
    ports:
      - "20262:7474"   # HTTP UI
      - "20263:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=linkedin_clone
    ports:
      - "20264:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "20265:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data: